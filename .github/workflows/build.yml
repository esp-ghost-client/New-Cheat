name: Build Amethyst X-Ray

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mc-1.21.4
            gradle: '8.12'
          - dir: mc-1.21.11
            gradle: '9.2.1'
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source if needed
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -oq "$z" -d "extracted_$(basename "$z" .zip | tr ' ()' '___')"
          done

      - name: Find project folder
        id: find
        run: |
          DIR=$(find . -type d -name "${{ matrix.dir }}" -not -path './.git/*' | head -n1)
          if [ -z "$DIR" ]; then
            echo "Folder ${{ matrix.dir }} not found in repo"
            find . -maxdepth 4 -not -path './.git/*' | head -80
            exit 1
          fi
          echo "Using $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AmethystXray-${{ matrix.dir }}
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
