name: Build Amethyst X-Ray

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mc-1.21.4
            gradle: '8.12'
          - dir: mc-1.21.11
            gradle: '9.2.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest source zip
        run: |
          shopt -s nullglob
          Z=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -n1 | cut -d' ' -f2-)
          if [ -n "$Z" ]; then
            echo "Using zip: $Z"
            unzip -oq "$Z" -d extracted
          fi

      - name: Patch drawBorder (1.21.11 compatibility)
        run: |
          python3 - <<'PY'
          import glob
          helper = '''    private static void border(DrawContext g, int x, int y, int w, int h, int color) {
              g.fill(x, y, x + w, y + 1, color);
              g.fill(x, y + h - 1, x + w, y + h, color);
              g.fill(x, y + 1, x + 1, y + h - 1, color);
              g.fill(x + w - 1, y + 1, x + w, y + h - 1, color);
          }

          '''
          for p in glob.glob('**/AxrScreen.java', recursive=True):
              s = open(p).read()
              if 'g.drawBorder(' not in s:
                  continue
              s = s.replace('g.drawBorder(', 'border(g, ')
              marker = '    private void diamond(DrawContext g'
              if 'private static void border(' not in s and marker in s:
                  s = s.replace(marker, helper + marker, 1)
              open(p, 'w').write(s)
              print('patched', p)
          PY

      - name: Find project folder
        id: find
        run: |
          DIR=$(find . -type d -name "${{ matrix.dir }}" -not -path './.git/*' | head -n1)
          if [ -z "$DIR" ]; then
            echo "Folder ${{ matrix.dir }} not found in repo"
            find . -maxdepth 4 -not -path './.git/*' | head -80
            exit 1
          fi
          echo "Using $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AmethystXray-${{ matrix.dir }}
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
